name: extension

# Nebula Shell (extension GNOME 46) probada en un GNOME Shell REAL headless:
# comportamiento y persistencia del estado, disable/enable limpio y cero
# errores JS en el log del shell.
on:
  push:
    paths:
      - extension/**
      - tools/test-extension.sh
      - tools/test-sidebar-core.sh
      - tools/test-state-persistence.sh
      - tools/test-state-persistence.mjs
      - dotfiles/nebula/**
      - bin/nebula-categories
      - .github/workflows/extension.yml
  pull_request:
    paths:
      - extension/**
      - tools/test-extension.sh
      - tools/test-sidebar-core.sh
      - tools/test-state-persistence.sh
      - tools/test-state-persistence.mjs
      - dotfiles/nebula/**
      - bin/nebula-categories
      - .github/workflows/extension.yml
  workflow_dispatch:

jobs:
  gnome-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Instalar GNOME Shell 46 (sin escritorio completo)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gnome-shell gjs libglib2.0-bin dbus python3-dbusmock python3-dbus \
            libglib2.0-dev-bin gir1.2-gtk-4.0 gnome-shell-extension-ubuntu-dock \
            xvfb xdotool xterm

      - name: Bus de sistema con logind
        run: |
          if ! busctl --system status org.freedesktop.login1 >/dev/null 2>&1; then
            sudo mkdir -p /run/dbus
            pgrep -x dbus-daemon >/dev/null || sudo dbus-daemon --system --fork
            sudo /usr/bin/python3 -m dbusmock --system --template logind &
            sleep 2
          fi

      - name: tools/test-state-persistence.sh
        run: bash tools/test-state-persistence.sh

      - name: tools/test-sidebar-core.sh (Producto 1)
        run: bash tools/test-sidebar-core.sh

      - name: tools/test-extension.sh (flags, meters, dock, barra inferior)
        run: bash tools/test-extension.sh
