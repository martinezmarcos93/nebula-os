name: extension

# Nebula Shell (extension GNOME 46) probada en un GNOME Shell REAL headless:
# comportamiento (FS-20 Overview/fullscreen, FS-16 senales, R-310 estado
# corrupto, disable/enable limpio) y cero errores JS en el log del shell.
on:
  push:
    paths:
      - extension/**
      - tools/test-extension.sh
      - dotfiles/nebula/**
      - bin/nebula-categories
      - .github/workflows/extension.yml
  pull_request:
    paths:
      - extension/**
      - tools/test-extension.sh
      - dotfiles/nebula/**
      - bin/nebula-categories
      - .github/workflows/extension.yml
  workflow_dispatch:

jobs:
  gnome-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GNOME Shell 46 (sin escritorio completo)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gnome-shell gjs libglib2.0-bin dbus python3-dbusmock python3-dbus \
            libglib2.0-dev-bin gir1.2-gtk-4.0 gnome-shell-extension-ubuntu-dock

      # GNOME Shell necesita org.freedesktop.login1 en el bus de sistema. El
      # runner trae systemd; si no estuviera, se usa el logind simulado.
      - name: Bus de sistema con logind
        run: |
          if ! busctl --system status org.freedesktop.login1 >/dev/null 2>&1; then
            sudo mkdir -p /run/dbus
            pgrep -x dbus-daemon >/dev/null || sudo dbus-daemon --system --fork
            sudo /usr/bin/python3 -m dbusmock --system --template logind &
            sleep 2
          fi

      - name: tools/test-extension.sh
        run: bash tools/test-extension.sh
