name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: make lint

      - name: Verificar finales de linea (LF)
        run: |
          if grep -rlIP '\r$' --include='*.sh' .; then
            echo "Hay scripts con CRLF; deben ser LF." >&2
            exit 1
          fi

      # Bateria estatica completa (bash -n, --help de cada bin/nebula-*,
      # marcadores autogen de eww.yuck, parseo de categories.toml, atajos
      # duplicados, deps declaradas). Antes CI solo corria shellcheck.
      - name: Tests estaticos (tools/test-session.sh --static)
        run: bash tools/test-session.sh --static
