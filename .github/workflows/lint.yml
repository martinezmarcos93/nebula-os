name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: make lint

      - name: Verificar finales de linea (LF)
        run: |
          if grep -rlIP '\r$' --include='*.sh' .; then
            echo "Hay scripts con CRLF; deben ser LF." >&2
            exit 1
          fi
