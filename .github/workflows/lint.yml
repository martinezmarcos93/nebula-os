name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar shellcheck y bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats python3-pytest bspwm xterm xvfb

      - name: shellcheck
        run: make lint

      - name: Verificar finales de linea (LF)
        run: |
          if grep -rlIP '\r$' --include='*.sh' .; then
            echo "Hay scripts con CRLF; deben ser LF." >&2
            exit 1
          fi

      # Bateria estatica completa (bash -n, --help de cada bin/nebula-*,
      # marcadores autogen de eww.yuck, parseo de categories.toml, atajos
      # duplicados, deps declaradas). Antes CI solo corria shellcheck.
      - name: Tests estaticos (tools/test-session.sh --static)
        run: bash tools/test-session.sh --static

      # Tests unitarios/integracion (bats) en HOME temporal por test. El
      # runner de GitHub es no-root, igual que un usuario real.
      # xvfb-run: tests/bspwm.bats corre contra bspwm REAL (bspwmrc del repo,
      # modo foco); sin DISPLAY esos tests se saltan solos.
      - name: Tests bats (tests/*.bats, con bspwm real en Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" bats tests/

      # Lector unico de categories.toml (bin/nebula-categories).
      - name: Tests Python (pytest)
        run: python3 -m pytest -q tests/
