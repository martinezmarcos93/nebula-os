# dotfiles/nebula/categories.toml
# ---------------------------------------------------------------------------
# Fuente UNICA de datos del sidebar de eww y del lanzador rofi.
# El generador `nebula-gen-panel` produce, a partir de este archivo:
#   - la seccion de categorias del sidebar eww (dotfiles/eww/eww.yuck)
#   - el menu rofi por categoria (nebula-gen-panel --menu)
#
# Cada categoria lista TODOS los programas tipicos de esa funcion (varios
# navegadores, varios editores, etc.). El generador filtra por `command -v` del
# primer token de `exec`:
#   - instalado  -> fila normal, con :onclick
#   - ausente    -> NO se lista
#   - categoria sin ninguna app instalada -> no se dibuja
# Los `nebula-*` se asumen siempre disponibles (los instala 50-funciones.sh).
#
# polybar (fallback degradado si eww no compila, ver docs/DESIGN.md E1) NO lee
# este archivo.
#
# Tras editar:  nebula-gen-panel     (o el atajo Super+Shift+C)
# `icono` es un token corto para uso futuro; hoy el generador no lo usa.
# Ver docs/DESIGN.md, seccion 6.
# ---------------------------------------------------------------------------

