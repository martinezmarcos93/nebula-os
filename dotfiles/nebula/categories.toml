# dotfiles/nebula/categories.toml
# ---------------------------------------------------------------------------
# Fuente UNICA de datos del panel de Nebula. La consumen:
#   - la extension de GNOME Shell (extension/, via extension/build.sh que
#     convierte este .toml a categories.json)
#   - el sidebar de eww + el menu rofi de la sesion bspwm (fallback), via el
#     generador `nebula-gen-panel`
#
# Cada categoria lista TODOS los programas tipicos de esa funcion (varios
# navegadores, varios editores, etc.). Se filtra por `command -v` del primer
# token de `exec`:
#   - instalado  -> se lista
#   - ausente    -> NO se lista
#   - categoria sin ninguna app instalada -> no se dibuja
# Los `nebula-*` se asumen siempre disponibles (los instala 50-funciones.sh).
#
# Orden y nombres alineados con la imagen objetivo (12 categorias). "Favoritos"
# es provisional (sera una lista de pins del usuario) y "Configuracion" abre los
# ajustes del sistema.
#
# Tras editar:
#   - extension:  bash extension/build.sh        (regenera categories.json)
#   - bspwm:      nebula-gen-panel               (o Super+Shift+C)
# `icono` es un token corto para uso futuro; los generadores no lo usan.
# Ver docs/DESIGN.md, seccion 6.
# ---------------------------------------------------------------------------

