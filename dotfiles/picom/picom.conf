## dotfiles/picom/picom.conf - Nebula OS  (picom >= 10)
## Sin blur a proposito: rendimiento en GPU/CPU modestas (ver docs/DESIGN.md E13).

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# --- Sombras -----------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@[0] = '_NET_WM_STATE_FULLSCREEN'",
    "class_g = 'steam_app_default'"
];

# --- Esquinas redondeadas -------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@[0] = '_NET_WM_STATE_FULLSCREEN'"
];

# --- Fundidos ------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# --- Opacidad ----------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# --- Tipos de ventana ------------------------------------------
wintypes:
{
    tooltip       = { fade = true; shadow = false; opacity = 0.95; };
    dock          = { shadow = false; };
    popup_menu    = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    notification  = { shadow = false; };
};
