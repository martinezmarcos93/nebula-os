## dotfiles/picom/picom.conf - Nebula OS  (picom v10, el de Ubuntu 24.04)
## Sin blur a proposito: rendimiento en GPU/CPU modestas (ver docs/DESIGN.md E13).
##
## Nota de sintaxis: la forma corta "_NET_WM_STATE@[0] = ..." (auto-deteccion
## de tipo con @[indice]) es de picom v11. En la v10 que trae Ubuntu 24.04 da
## "Target type cannot be determined" y picom ABORTA al arrancar -> nos
## quedabamos sin compositor entero. La forma portable en v10 es indicar el
## tipo (:32a = lista de atomos de 32 bits) y usar *= (contiene el elemento).

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;

# --- Sombras -----------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
    "class_g = 'steam_app_default'"
];

# --- Esquinas redondeadas -------------------------------------------
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Fundidos ------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

# --- Opacidad ----------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# --- Tipos de ventana ------------------------------------------
wintypes:
{
    tooltip       = { fade = true; shadow = false; opacity = 0.95; };
    dock          = { shadow = false; };
    popup_menu    = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
    notification  = { shadow = false; };
};
