; dotfiles/polybar/config.ini - Nebula OS  "Cosmic Dark"
; Barra INFERIOR de sistema (reloj + recursos). El panel lateral por
; categorias es tarea de eww (NEBULA_PANEL=eww) o del menu rofi (Super+C).

[colors]
bg      = #cc000000
fg      = #e5e7eb
muted   = #9ca3af
violeta = #7c3aed
cian    = #22d3ee
warn    = #f59e0b

[bar/nebula]
width  = 100%
height = 26pt
bottom = true
radius = 0
background = ${colors.bg}
foreground = ${colors.fg}
line-size  = 2pt
padding-left  = 1
padding-right = 2
module-margin = 1
separator = "|"
separator-foreground = ${colors.muted}
font-0 = Inter:size=10;2
font-1 = JetBrainsMono Nerd Font:size=11;3
modules-left   = bspwm
modules-center = date
modules-right  = cpu ram gpu temperature pulseaudio
cursor-click   = pointer
enable-ipc     = true

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-foreground = ${colors.cian}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/ram]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/gpu]
type = custom/script
exec = ~/.config/polybar/scripts/gpu.sh
interval = 5

[module/temperature]
type = internal/temperature
interval = 5
warn-temperature = 80
label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.warn}

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = VOL mute
label-muted-foreground = ${colors.muted}

[settings]
screenchange-reload = true
pseudo-transparency = true
